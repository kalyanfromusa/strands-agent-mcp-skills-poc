# =====================================================================================================
# .github/workflows/build.yml: after a merge to main, run every check and build every image again
#
# What this file does
#   Runs the same checks as pull requests (_checks.yml) on the merged commit: tests, IaC lint, and each
#   image built for arm64, started, checked and scanned. It does NOT push images and does NOT deploy.
#
# Where it fits
#   A green build.yml run means "this commit is ready to deploy". The job summary shows the SHA to
#   pass to deploy.yml. Images are pushed only by deploy.yml, right before deploying them, so ECR only
#   ever holds deployed images and can keep exactly two (current + previous).
#   The build also warms the GitHub Actions layer cache, so the deploy's own build is fast.
#
# Step by step
#   1. checks: run _checks.yml (tests, Terraform checks, the five images built, started and scanned).
#   2. ready:  only if every check passed, write a "Ready to deploy" note with the commit SHA on the
#              run's summary page.
#
# Key terms
#   SHA: the 40-character fingerprint git gives every commit; images are tagged with it.
#   ECR (Elastic Container Registry): AWS's private storage for container images.
#   Layer cache: Docker reuses unchanged parts of an image from earlier builds instead of rebuilding.
#   workflow_dispatch: also lets you start this workflow by hand (Actions → build → Run workflow).
# =====================================================================================================
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge cancels the build still running for an older one: only the newest commit matters.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: the shared checks (no AWS access, nothing pushed).
  checks:
    uses: ./.github/workflows/_checks.yml

  # Step 2: runs only when every check passed (needs: checks). Writes a note, nothing else.
  # "image_tag empty" in deploy.yml means "the head of main when you start the deploy", which is this
  # commit as long as nothing else was merged since.
  ready:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      # The SHA arrives through an environment variable rather than pasted into the script (safer habit).
      - name: Ready to deploy
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Ready to deploy"
            echo ""
            echo "All checks passed for \`${SHA}\`. To deploy it: Actions → **deploy** → Run workflow"
            echo "(target_env = prod, image_tag empty = this commit). Nothing has been pushed or deployed."
          } >> "$GITHUB_STEP_SUMMARY"
