# =====================================================================================================
# .github/workflows/_checks.yml: the shared checks (tests, IaC lint, image build + check + scan)
#
# What this file does
#   A reusable workflow (called with `uses:` from ci.yml and build.yml, never run by itself). It runs,
#   with no AWS access at all:
#     test    uv sync + pytest (offline: moto, no AWS) and the lock-file drift check;
#     iac     terraform fmt/validate for the three roots, tflint, checkov (report only for now);
#     images  one leg per image on a native arm64 runner: build, start + check, Trivy scan. No push.
#
# Where it fits
#   ci.yml = these checks + a read-only plan on pull requests. build.yml = these checks on main after a
#   merge. Nothing here can change AWS; deploy.yml is the only workflow that deploys.
#
# Key terms
#   Reusable workflow: a workflow other workflows call like a function (on: workflow_call).
#   permissions: what the job's built-in GITHUB_TOKEN may do; read-only here.
# =====================================================================================================
name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      # The image lock files must match uv.lock (scripts/pin_requirements.py).
      - run: uv run python scripts/pin_requirements.py --check

  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate (bootstrap, platform, main)
        run: |
          for d in infra/terraform/bootstrap infra/terraform/platform infra/terraform; do
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        run: tflint --recursive --chdir=infra/terraform --minimum-failure-severity=error
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Report only for now (soft-fail); accepted findings are marked in the code with checkov:skip.
      - name: checkov
        run: uvx --from checkov checkov -d infra/terraform --framework terraform --compact --quiet --soft-fail

  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: agent
            dockerfile: agent/Dockerfile
          - kind: support_mcp
            dockerfile: mcp_servers/support_mcp/Dockerfile
          - kind: orders_lambda
            dockerfile: mcp_servers/orders_lambda/Dockerfile
          - kind: role_mapper
            dockerfile: identity/role_mapper/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-image
        with:
          kind: ${{ matrix.kind }}
          dockerfile: ${{ matrix.dockerfile }}
          tag: ${{ github.sha }}
