# =====================================================================================================
# .github/workflows/deploy.yml: the ONLY way ShopAssist is deployed (manual, approved, Terraform)
#
# What this file does
#   Run by hand (Actions → deploy → Run workflow) with:
#     target_env  prod (default) or dev (blocked unless the repository variable DEPLOY_DEV = true)
#     image_tag   the full git SHA to deploy. Empty = the commit you run it on (the head of main).
#                 An older SHA that is still in ECR = a rollback (ECR keeps current + previous).
#   Jobs:
#     1. prepare  checks the inputs, that the SHA is on main, and runs the unit tests.
#     2. plan     read-only `terraform plan` with the plan role. Its summary (addresses + actions,
#                 no values) is what you review on the approval screen.
#     3. deploy   waits in the GitHub environment <target_env> (prod: you must approve). Then, with the
#                 apply role: builds + checks + scans + pushes any image of that SHA not yet in ECR,
#                 re-plans and refuses to continue if the plan differs from the one you approved,
#                 applies it, and runs the access smoke test (scenarios b, c, d) against the result.
#                 If it fails before Terraform started changing anything, it deletes the images it
#                 pushed, so ECR still holds exactly "current + previous".
#
# Where it fits
#   Pull requests (ci.yml) and merges (build.yml) only check and build. Nothing deploys automatically.
#   Terraform (infra/terraform, state in S3) does every change, image rollouts included.
#
# Security
#   - AWS access only through GitHub OIDC: the plan role (main) and the apply role, which AWS lets
#     only a job in the GitHub environment <target_env> assume. No AWS keys are stored in GitHub.
#   - The prod environment allows only the main branch and needs your approval (GitHub settings).
#   - Public logs: Terraform's own output goes to files that are never printed or uploaded. The demo
#     users' passwords that Terraform writes for the smoke test are deleted at the end of the job.
#   - Inputs reach the shell only through environment variables, after validation.
#
# Repository variables: AWS_REGION, AWS_PLAN_ROLE, DEPLOY_DEV. Environment variable: AWS_APPLY_ROLE.
# =====================================================================================================
name: deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to deploy
        type: choice
        options: [prod, dev]
        default: prod
      image_tag:
        description: Full 40-character git SHA to deploy (empty = this commit). An older SHA = rollback.
        type: string
        default: ""

permissions:
  contents: read

# One deploy per environment at a time; never cancel one half-way.
concurrency:
  group: deploy-${{ inputs.target_env }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TARGET_ENV: ${{ inputs.target_env }}

jobs:
  # ------------------------------------------------------------------ 1. inputs + unit tests
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.inputs.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # needed to check that image_tag is a commit on main

      - name: Check inputs
        id: inputs
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEPLOY_DEV: ${{ vars.DEPLOY_DEV }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::deploy only runs from main (got $REF)"; exit 1; }
          case "$TARGET_ENV" in
            prod) ;;
            dev) [ "$DEPLOY_DEV" = "true" ] || { echo "::error::dev deploys are switched off (DEPLOY_DEV != true)"; exit 1; } ;;
            *) echo "::error::unknown target_env"; exit 1 ;;
          esac
          sha="${INPUT_TAG:-$RUN_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character lowercase git SHA"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not a commit on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\` to **$TARGET_ENV**" >> "$GITHUB_STEP_SUMMARY"

      # The prod gate lives in GitHub settings, where it can be switched off by accident (it was, once).
      # Refuse to run against prod unless the environment really has a required reviewer.
      - name: Check that ${{ inputs.target_env }} still requires a reviewer
        if: inputs.target_env == 'prod'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          rules="$(gh api "repos/${REPO}/environments/${TARGET_ENV}" --jq '[.protection_rules[].type] | join(",")')"
          case ",$rules," in
            *,required_reviewers,*) echo "OK: ${TARGET_ENV} requires a reviewer ($rules)" ;;
            *) echo "::error::GitHub environment ${TARGET_ENV} has no required reviewer (rules: ${rules:-none}). Add one in Settings → Environments → ${TARGET_ENV} before deploying or destroying."; exit 1 ;;
          esac

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  # ------------------------------------------------------------------ 2. what will change (read-only)
  plan:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      hash: ${{ steps.plan.outputs.hash }}
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: AWS credentials (plan role, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE }}
          role-session-name: gha-deploy-plan-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: terraform plan (output kept private; summary only)
        id: plan
        working-directory: infra/terraform
        run: |
          terraform init -backend-config="envs/${TARGET_ENV}.backend.hcl" -no-color > init.log 2>&1 \
            || { grep -E "^(Error|│)" init.log | head -40; exit 1; }
          terraform plan -lock=false -no-color -var-file="envs/${TARGET_ENV}.tfvars" -var "image_tag=${IMAGE_TAG}" \
            -out=tfplan > plan.log 2>&1 || { grep -E "^(Error|│)" plan.log | head -40; exit 1; }
          terraform show -json tfplan > plan.json
          uv run --no-project python ../../scripts/tf_plan_summary.py --title "Plan for ${TARGET_ENV} @ ${IMAGE_TAG:0:12} (approve below)" \
            < plan.json >> "$GITHUB_STEP_SUMMARY"
          echo "hash=$(uv run --no-project python ../../scripts/tf_plan_summary.py --hash < plan.json)" >> "$GITHUB_OUTPUT"
          rm -f tfplan plan.json plan.log init.log

  # ------------------------------------------------------------------ 3. approved: push, apply, smoke
  deploy:
    needs: [prepare, plan]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: ${{ inputs.target_env }} # prod: waits for your approval; dev: no reviewer
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.prepare.outputs.sha }}
      APPROVED_HASH: ${{ needs.plan.outputs.hash }}
    steps:
      # Terraform code and scripts from the commit this run is on (main) ...
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ... and the source of the images from image_tag (the same commit unless this is a rollback).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          path: src
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen # Terraform's local-exec steps (seed, log groups, gateway sync) use it
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: AWS credentials (apply role for ${{ inputs.target_env }}, OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE }}
          role-session-name: gha-deploy-${{ inputs.target_env }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Which images of this SHA are not in ECR yet?
      - name: Find missing images
        id: missing
        run: |
          for kind in agent support_mcp orders_lambda; do
            repo="shopassist-${kind//_/-}"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
              echo "$kind=false" >> "$GITHUB_OUTPUT"; echo "$repo:${IMAGE_TAG:0:12} already in ECR"
            else
              echo "$kind=true" >> "$GITHUB_OUTPUT"; echo "$repo:${IMAGE_TAG:0:12} will be built"
            fi
          done

      - name: Build agent
        if: steps.missing.outputs.agent == 'true'
        uses: ./.github/actions/build-image
        with: { kind: agent, dockerfile: agent/Dockerfile, tag: "${{ env.IMAGE_TAG }}", source: src }
      - name: Build support_mcp
        if: steps.missing.outputs.support_mcp == 'true'
        uses: ./.github/actions/build-image
        with: { kind: support_mcp, dockerfile: mcp_servers/support_mcp/Dockerfile, tag: "${{ env.IMAGE_TAG }}", source: src }
      - name: Build orders_lambda
        if: steps.missing.outputs.orders_lambda == 'true'
        uses: ./.github/actions/build-image
        with: { kind: orders_lambda, dockerfile: mcp_servers/orders_lambda/Dockerfile, tag: "${{ env.IMAGE_TAG }}", source: src }

      - name: Push the new images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          NEED_AGENT: ${{ steps.missing.outputs.agent }}
          NEED_SUPPORT: ${{ steps.missing.outputs.support_mcp }}
          NEED_ORDERS: ${{ steps.missing.outputs.orders_lambda }}
        run: |
          pushed=""
          for pair in "agent:$NEED_AGENT" "support_mcp:$NEED_SUPPORT" "orders_lambda:$NEED_ORDERS"; do
            kind="${pair%%:*}"; need="${pair##*:}"
            [ "$need" = "true" ] || continue
            repo="shopassist-${kind//_/-}"
            docker tag "local/${kind}:${IMAGE_TAG}" "${REGISTRY}/${repo}:${IMAGE_TAG}"
            docker push --quiet "${REGISTRY}/${repo}:${IMAGE_TAG}"
            pushed="$pushed $repo"
            # Remember it immediately, so a failure in a later push still cleans this one up.
            echo "PUSHED_REPOS=${pushed# }" >> "$GITHUB_ENV"
          done
          echo "pushed: ${pushed:-nothing (all images already in ECR)}"

      - name: Re-plan and compare with the approved plan
        working-directory: infra/terraform
        run: |
          terraform init -backend-config="envs/${TARGET_ENV}.backend.hcl" -no-color > init.log 2>&1 \
            || { grep -E "^(Error|│)" init.log | head -40; exit 1; }
          terraform plan -no-color -var-file="envs/${TARGET_ENV}.tfvars" -var "image_tag=${IMAGE_TAG}" \
            -out=tfplan > plan.log 2>&1 || { grep -E "^(Error|│)" plan.log | head -40; exit 1; }
          now="$(terraform show -json tfplan | uv run --no-project python ../../scripts/tf_plan_summary.py --hash)"
          if [ "$now" != "$APPROVED_HASH" ]; then
            echo "::error::The plan changed after approval (something else changed the environment). Nothing applied; run the deploy again."
            exit 1
          fi
          echo "plan matches the approved one (${now:0:16})"

      - name: terraform apply (output kept private)
        working-directory: infra/terraform
        run: |
          echo "APPLY_STARTED=1" >> "$GITHUB_ENV"
          if terraform apply -no-color tfplan > apply.log 2>&1; then
            grep -E "^Apply complete" apply.log | tee -a "$GITHUB_STEP_SUMMARY"
          else
            grep -E "^(Error|│)" apply.log | head -60
            exit 1
          fi

      - name: Smoke test (access scenarios b, c, d)
        env:
          SHOPASSIST_ENV: ${{ inputs.target_env }}
        run: uv run python scripts/demo_access.py --no-reseed --only b,c,d

      # Failed before Terraform changed anything: remove what this run pushed (ECR keeps current + previous).
      - name: Clean up pushed images after an early failure
        if: failure() && env.APPLY_STARTED != '1' && env.PUSHED_REPOS != ''
        run: |
          for repo in $PUSHED_REPOS; do
            aws ecr batch-delete-image --repository-name "$repo" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null
            echo "deleted $repo:${IMAGE_TAG:0:12}"
          done

      - name: Remove local credentials files
        if: always()
        run: rm -rf .deploy infra/terraform/tfplan infra/terraform/*.log
